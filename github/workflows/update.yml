# .github/workflows/update.yml
name: update-concert-data
on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y && npm i fast-xml-parser
      - run: node scripts/fetch-kopis.mjs
        env:
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/concerts.json
          git diff --staged --quiet || git commit -m "chore: update concert data"
          git push
